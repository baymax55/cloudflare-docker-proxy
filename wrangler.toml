name = "cloudflare-docker-proxy"
main = "src/index.js"
compatibility_date = "2023-12-01"
workers_dev = true

[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"

[vars]
MODE = "production"
TARGET_UPSTREAM = ""
CUSTOM_DOMAIN = ""

[env.dev.vars]
MODE = "debug"
TARGET_UPSTREAM = "https://registry-1.docker.io"
CUSTOM_DOMAIN = ""

[env.production]
name = "cloudflare-docker-proxy"

[env.production.vars]
MODE = "production"
TARGET_UPSTREAM = ""
CUSTOM_DOMAIN = ""

[env.staging]
name = "cloudflare-docker-proxy-staging"

[env.staging.vars]
MODE = "staging"
TARGET_UPSTREAM = ""
CUSTOM_DOMAIN = ""

